plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dsa'
version = '0.0.1-SNAPSHOT'
description = 'flawless'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
//    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // @Valid, @NotNull, @Min 등 입력값 검증(Bean Validation)을 쓰기 위해 추가
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // TODO(REQ-NF-G-007 부하테스트/모니터링 표준 부재): Prometheus 연동 의존성이 주석 처리돼 있다.
    // 부하테스트(JMeter 등)와 짝지어 개선 전/후 지표를 비교하려면 아래 주석 해제 +
    // application.yaml에 management.endpoints.web.exposure.include: prometheus 추가 필요.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-session-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'com.h2database:h2' // FlawlessApplicationTests: 이미지 빌드(docker build) 중엔 MySQL이 없으므로 인메모리 DB로 컨텍스트 로딩
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
// bootJar로 jar파일을 만들면, ArchUnit을 통한 테스트를 바이패스하는 것을 방지
tasks.named("bootJar") {
    dependsOn(tasks.test)
}
