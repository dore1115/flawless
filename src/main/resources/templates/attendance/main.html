  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
</style>
  <script src="/js/attendance/main.js" defer></script>
</head>
<body class="bg-white">

  <div class="bg-white w-full min-h-screen flex flex-col">

    <!-- TopNav -->
    <header class="bg-[#1e293b] h-16 flex items-center justify-between px-6 shrink-0">
      <div class="flex flex-col leading-tight">
        <a class="font-bold text-sm text-white" href="/">ERP SYSTEM・근태관리</a>
        <p class="font-normal text-[11px] text-slate-400">인사관리 시스템</p>
      </div>
    </header>

    <!-- BodyRow -->
    <div class="flex items-start w-full flex-1">

      <!-- Sidebar -->
      <aside class="flex flex-col gap-1 items-start px-3 py-5 w-[220px] shrink-0">
        <a href="#" class="bg-blue-600 flex gap-2.5 items-center px-3 py-2.5 rounded-md w-full">
          <svg class="size-[18px] text-white shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15.5 14"></polyline>
          </svg>
          <span class="font-semibold text-sm text-white whitespace-nowrap">근태관리</span>
        </a>
        <a href="#" class="flex gap-2.5 items-center px-3 py-2.5 rounded-md w-full hover:bg-slate-50">
          <svg class="size-[18px] text-slate-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3v4a1 1 0 0 0 1 1h4"></path>
            <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"></path>
            <line x1="9" y1="13" x2="15" y2="13"></line>
            <line x1="9" y1="17" x2="15" y2="17"></line>
          </svg>
          <span class="font-medium text-sm text-black whitespace-nowrap">휴가신청</span>
        </a>
      </aside>

      <!-- MainContent -->
      <main class="flex flex-col gap-4 p-6 flex-1 min-w-0">

        <!-- PageHeaderRow -->
        <div class="flex items-center justify-between w-full">
          <div class="flex gap-4 items-center">
            <h1 class="font-bold text-[18px] text-[#0f172a] whitespace-nowrap">월간 근태 현황</h1>
            <div class="bg-white border border-[#e2e8f0] flex gap-2.5 items-center px-3 py-1.5 rounded-md">
              <a th:href="@{/attendance(year=${calendar.prevYear}, month=${calendar.prevMonth})}" aria-label="이전 달" class="shrink-0">
                <svg class="size-[14px] text-[#334155]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </a>
              <span class="font-semibold text-sm text-[#334155] whitespace-nowrap" th:text="|${calendar.year}년 ${calendar.month}월|">2026년 9월</span>
              <a th:href="@{/attendance(year=${calendar.nextYear}, month=${calendar.nextMonth})}" aria-label="다음 달" class="shrink-0">
                <svg class="size-[14px] text-[#334155]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </a>
            </div>
          </div>
          <div class="flex gap-2 items-start">
            <button id="clock-in" type="button" class="bg-blue-600 flex items-center px-5 py-2.5 rounded-md hover:bg-blue-700 transition-colors">
              <span class="font-semibold text-sm text-white whitespace-nowrap">출근</span>
            </button>
            <button id="clock-out" type="button" class="bg-white border border-[#ccd6e2] flex items-center px-5 py-2.5 rounded-md hover:bg-slate-50 transition-colors">
              <span class="font-semibold text-sm text-[#334155] whitespace-nowrap">퇴근</span>
            </button>
          </div>
        </div>

        <!-- SubInfoRow -->
        <div class="bg-[#f8fafc] border border-[#e2e8f0] flex items-center justify-between px-3.5 py-2.5 rounded-md w-full">
          <div class="flex gap-2 items-center">
            <svg class="size-[14px] text-[#475569] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <p class="font-normal text-[13px] text-[#475569] whitespace-nowrap"
               th:text="|조회기간  ${calendar.year}.${#numbers.formatInteger(calendar.month,2)}.01 ~ ${calendar.year}.${#numbers.formatInteger(calendar.month,2)}.${#numbers.formatInteger(calendar.lastDay,2)}|">
              조회기간&nbsp;&nbsp;2026.09.01 ~ 2026.09.30
            </p>
          </div>
        </div>

        <!-- Calendar -->
        <div class="bg-white border border-[#e2e8f0] flex flex-col rounded-md w-full overflow-hidden">

          <!-- WeekdayHeader (요일은 고정이라 정적으로 둡니다) -->
          <div class="bg-[#f1f5f9] border-b border-[#e2e8f0] cal-grid w-full">
            <div class="h-[34px] flex items-center justify-center py-2"><p class="font-bold text-xs text-[#3b82f6]">Sun</p></div>
            <div class="h-[34px] flex items-center justify-center py-2"><p class="font-bold text-xs text-[#64748b]">Mon</p></div>
            <div class="h-[34px] flex items-center justify-center py-2"><p class="font-bold text-xs text-[#64748b]">Tue</p></div>
            <div class="h-[34px] flex items-center justify-center py-2"><p class="font-bold text-xs text-[#64748b]">Wed</p></div>
            <div class="h-[34px] flex items-center justify-center py-2"><p class="font-bold text-xs text-[#64748b]">Thu</p></div>
            <div class="h-[34px] flex items-center justify-center py-2"><p class="font-bold text-xs text-[#64748b]">Fri</p></div>
            <div class="h-[34px] flex items-center justify-center py-2"><p class="font-bold text-xs text-[#3b82f6]">Sat</p></div>
          </div>

          <!-- Week rows: calendar.grid (List<List<Integer>>, null = 이번 달 밖 빈칸) 기준으로 렌더링 -->
          <div th:each="week, weekStat : ${calendar.grid}" class="cal-grid w-full">
            <div th:each="day, dayStat : ${week}"
                 th:with="isWeekend=${dayStat.index == 0 or dayStat.index == 6},
                          isToday=${day != null and T(java.time.LocalDate).of(calendar.year, calendar.month, day) == T(java.time.LocalDate).now()},
                          record=${day != null ? attendanceMap.get(day) : null}"
                 class="h-[86px] p-2 flex flex-col gap-1"
                 th:classappend="|${dayStat.index > 0 ? 'border-l ' : ''}${weekStat.last ? 'border-b ' : ''}${isToday ? 'bg-white border-2 border-blue-600 relative z-10 -mt-px -ml-px' : (day == null ? 'bg-[#f9f9f9] border-t border-[#e2e8f0]' : (isWeekend ? 'bg-[#f9f9f9] border-t border-[#e2e8f0]' : 'bg-white border-t border-[#e2e8f0]'))}|">

              <th:block th:if="${day != null}">
                <!-- 날짜 숫자: 오늘이면 파란 원 뱃지, 주말이면 흐린 색, 평일이면 진한 색 -->
                <span th:if="${isToday}" th:text="${day}"
                      class="bg-blue-600 text-white text-xs font-bold size-[22px] rounded-full flex items-center justify-center"></span>
                <p th:unless="${isToday}" th:text="${day}"
                   class="font-semibold text-[13px]"
                   th:classappend="${isWeekend} ? 'text-[#ccd6e2]' : 'text-[#334155]'"></p>

                <!-- 출근/퇴근 기록: 값이 있을 때만 표시 -->
                <span th:if="${record != null and record.clockIn != null}"
                      th:text="|출근 ${#temporals.format(record.clockIn, 'HH:mm')}|"
                      class="bg-[#dbe8fe] text-[#1d4ed8] text-[11px] px-1.5 py-0.5 rounded self-start"></span>
                <span th:if="${record != null and record.clockOut != null}"
                      th:text="|퇴근 ${#temporals.format(record.clockOut, 'HH:mm')}|"
                      class="bg-[#f1f5f9] text-[#64748b] text-[11px] px-1.5 py-0.5 rounded self-start"></span>

                <!-- 근무중: 오늘 && 출근했고 && 아직 퇴근 안 함 -->
                <span th:if="${isToday and record != null and record.clockIn != null and record.clockOut == null}"
                      class="bg-blue-600 text-white text-[11px] px-1.5 py-0.5 rounded self-start">근무중</span>
              </th:block>
            </div>
          </div>

        </div>
        <!-- /Calendar -->

      </main>
    </div>
  </div>

</body>
</html>
