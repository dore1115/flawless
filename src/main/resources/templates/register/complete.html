<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사원 계정 등록 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- 상단 헤더 -->
<header class="bg-[#0f172a] h-[60px] flex items-center px-8">
    <a class="text-white font-bold text-[15px]" href="/">ERP SYSTEM · 관리자 콘솔</a>
    <span class="ml-auto text-slate-400 text-sm">사원 관리 &gt; 등록 완료</span>
</header>

<main class="flex justify-center pt-16">
    <div class="w-[500px] bg-white rounded-xl border border-slate-200 px-10 py-10">

        <!-- 체크 아이콘 -->
        <div class="flex justify-center mb-6">
            <div class="w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M4 12l6 6 10-10" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
        </div>

        <h1 class="text-center text-xl font-bold text-slate-900">사원 계정이 등록되었습니다</h1>
        <p class="text-center text-sm text-slate-500 mt-2">아래 임시 비밀번호는 이 화면에서만 확인 가능합니다.</p>

        <!-- 아이디 -->
        <div class="mt-8 rounded-md bg-slate-50 border border-slate-200 px-4 py-3">
            <p class="text-[11px] text-slate-500">아이디</p>
            <p class="text-sm font-semibold text-slate-900 mt-1" th:text="${loginId}">emp2026099</p>
        </div>

        <!-- 임시 비밀번호 -->
        <div class="mt-3 rounded-md bg-amber-50 border border-amber-200 px-4 py-3">
            <p class="text-[11px] text-amber-800">임시 비밀번호 (1회만 표시됩니다)</p>
            <p class="text-base font-bold text-amber-800 tracking-wide mt-1" th:text="${tempPassword}">qX9!mZp2</p>
        </div>

        <p class="text-center text-[11px] text-slate-400 mt-6">
            ※ 새로고침·재조회 시 다시 확인할 수 없으니 사원에게 직접 전달해 주세요.
        </p>

        <a th:href="@{/hr/employees}"
           class="mt-6 block text-center h-11 leading-[44px] rounded-md bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">
            사원 목록으로 이동
        </a>
    </div>
</main>
</body>
</html>
