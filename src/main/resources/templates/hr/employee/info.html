<!--
  templates/hr/employee/info.html
  화면 ID: HR-002 (사원 정보 조회·수정)
  대응 Controller: EmployeeController.info() [GET /hr/employees/{id}/info], EmployeeController.updateAssignment() [POST /hr/employees/{id}/assignment]
  관련 요구사항: REQ-F-M-004 — "사원 1명에게 할당된 정보를 다른 정보로 변경한다."
    사원에게 할당된 정보 전체(이름/이메일/연락처/주소/직책/부서)를 이 화면 한 곳에서 함께 수정한다.
  접근 권한: 인사관리자
  ※ REQ-NF-G-003 / REQ-NF-H-004(Authority 미비, IDOR) 결함 시딩으로 인해 현재는 인가 검증이 비어 있는 상태.
  ※ REQ-NF-H-010(동시성 문제, Lost Update) 결함 시딩으로 인해 낙관적/비관적 락 없이 그대로 갱신된다.
  ※ 입력값 검증 실패(이름/이메일/연락처/주소 공백, 유효하지 않은 직책·부서) 시 화면 상세 설계 공통 정책상
    "폼 화면 유지 + 필드 오류 표시"가 목표이나, REQ-NF-G-004(예외처리 표준 부재)가 아직 미적용이라
    현재는 400 오류 페이지로 이동한다. GlobalExceptionHandler 도입 시 함께 개선 예정.
  Model 속성: employeeId(Long), assignmentForm(EmployeeAssignmentForm),
              positionOptions(List<PositionRowDto>), departmentOptions(List<DepartmentRowDto>), message(String, flash)
-->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사원 정보 조회·수정 | Enterprise Resource Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100">

<header class="h-16 bg-slate-900 flex items-center px-4 sm:px-8 gap-4 sm:gap-10">
    <a class="text-white text-sm sm:text-base font-bold whitespace-nowrap" href="/">ERP SYSTEM</a>
</header>

<main class="max-w-[1200px] mx-auto px-6 py-10">

    <!-- 성공 메시지: 화면설계서 5.공통 UI 규칙 - 상단 배너(플래시 메시지)로 표시 -->
    <div th:if="${message}" class="mb-6 flex items-center gap-3 bg-green-50 border border-green-200 rounded-md px-4 py-3">
        <span class="flex-none w-4 h-4 rounded-full bg-green-500 text-white text-[10px] font-bold flex items-center justify-center">✓</span>
        <p class="text-sm font-medium text-green-700" th:text="${message}">변경이 완료되었습니다.</p>
    </div>

    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-slate-900">사원 정보 조회·수정</h2>
        <a th:href="@{/hr/employees}" class="text-sm text-blue-600 hover:underline">← 사원 목록으로</a>
    </div>

    <div class="bg-white shadow-sm border border-slate-200 p-8">
        <form th:action="@{'/hr/employees/' + ${employeeId} + '/assignment'}"
              th:object="${assignmentForm}" method="post" class="space-y-6" id="assignmentForm">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">이름</label>
                    <input type="text" id="name" th:field="*{name}"
                           class="w-full h-11 px-4 border border-slate-300 rounded-md text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">이메일</label>
                    <input type="email" id="email" th:field="*{email}"
                           class="w-full h-11 px-4 border border-slate-300 rounded-md text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                </div>

                <div>
                    <label for="phone" class="block text-sm font-semibold text-slate-700 mb-2">연락처</label>
                    <input type="text" id="phone" th:field="*{phone}" placeholder="010-0000-0000"
                           class="w-full h-11 px-4 border border-slate-300 rounded-md text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                </div>

                <div>
                    <label for="address" class="block text-sm font-semibold text-slate-700 mb-2">주소</label>
                    <input type="text" id="address" th:field="*{address}"
                           class="w-full h-11 px-4 border border-slate-300 rounded-md text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                </div>

                <div>
                    <label for="positionId" class="block text-sm font-semibold text-slate-700 mb-2">직책</label>
                    <select id="positionId" th:field="*{positionId}"
                            class="w-full h-11 px-4 border border-slate-300 rounded-md text-sm text-slate-900 bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                        <!-- 활성 직책만 노출 (is_active=1) -->
                        <option th:each="position : ${positionOptions}"
                                th:value="${position.id}"
                                th:text="${position.positionName}"></option>
                    </select>
                </div>

                <div>
                    <label for="departmentId" class="block text-sm font-semibold text-slate-700 mb-2">부서</label>
                    <select id="departmentId" th:field="*{departmentId}"
                            class="w-full h-11 px-4 border border-slate-300 rounded-md text-sm text-slate-900 bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                        <!-- 활성 부서만 노출 (is_active=1) -->
                        <option th:each="department : ${departmentOptions}"
                                th:value="${department.id}"
                                th:text="${department.departmentName}"></option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t border-slate-200">
                <button type="submit" id="submitBtn"
                        class="h-11 px-6 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-md transition-colors">
                    저장
                </button>
            </div>
        </form>
    </div>
</main>

<script>
    // 화면설계서 5.공통 UI 규칙: 1초 이상 걸릴 수 있는 요청은 버튼 비활성화(중복 제출 방지)
    document.getElementById('assignmentForm').addEventListener('submit', function () {
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '저장 중...';
    });
</script>

</body>
</html>
