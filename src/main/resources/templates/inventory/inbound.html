<!DOCTYPE html>
<!--
  IV-003 재고 입고 처리 화면

  - 실제로 화면을 켜보니 카드가 좁아서 오른쪽에 빈 공간이 많이 남는 문제가 있어,
    "입력칸 배치는 그대로 두고 카드(메인 영역) 자체의 너비만" 넓혀서(w-full) 여백을
    줄임.
  - 사이드바의 "재고 조회 / 출고 / 품목 관리" 메뉴는
    해당 화면들이 실제로 만들어지면 링크만 실제 주소로 변경.
  - [출고 화면(outbound.html) 추가 시 이 파일도 한 줄 수정함] "출고" 메뉴가 이제 실제로
    만들어져서, href="#"(눌러도 반응 없음)이던 것을 실제 주소 "/inventory/outbound"로 바꿈.
    다른 부분은 전혀 건드리지 않음.
  - [품목 관리(item/list.html) 추가 시 이 파일도 한 줄 수정함] 같은 이유로 "품목 관리" 메뉴의
    href="#"를 실제 주소 "/inventory"로 바꿈. 다른 부분은 전혀 건드리지 않음.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 입고 처리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- [Tom Select 적용] 품목 선택 <select>가 타이핑으로 검색되는 드롭다운이 되도록 붙임.
         품목이 많아지면 그냥 스크롤해서 찾아야 하던 문제를 해결하려고 추가함(요구사항 문서엔
         없는 UX 개선이라, 마음에 안 들면 언제든 이 링크/스크립트 세 줄만 지우면 원래대로 돌아감 -
         적용 전 원본은 tomselect_backup/inbound.html.before로 따로 백업해둠). -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex flex-col">

    <!-- 상단 헤더: 짙은 남색 바. 시스템 이름 + 현재 위치(품목관리)를 보여줌 -->
    <header class="bg-slate-900 text-white px-6 py-4 flex items-center shrink-0">
        <span class="font-bold tracking-wide">ERP SYSTEM</span>
        <span class="text-slate-400 ml-2">· 품목관리</span>
    </header>

    <div class="flex flex-1">

        <!-- 왼쪽 사이드바 메뉴: 재고 조회 / 입고(현재 화면) / 출고 / 품목 관리 -->
        <aside class="w-48 bg-white border-r border-gray-200 shrink-0 py-4 px-3">
            <nav class="space-y-1 text-sm">
                <a href="#" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">재고 조회</a>
                <!-- 지금 만든 화면이라 파란색 배경으로 "현재 위치"를 표시 -->
                <a href="/inventory/inbound" class="block px-3 py-2 rounded-md bg-blue-600 text-white font-medium">입고</a>
                <a href="/inventory/outbound" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">출고</a>
                <a href="/inventory" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">품목 관리</a>
            </nav>
        </aside>

        <!-- 오른쪽 메인 영역: 실제 입고 처리 폼이 들어가는 흰색 카드.
             w-full로 메인 영역 너비에 꽉 차게 만들어서 오른쪽 빈 공간을 줄임.
             (입력칸 배치는 디자인 시안과 동일하게 위아래로 쌓는 방식 그대로 유지) -->
        <main class="flex-1 p-8">
            <div class="w-full bg-white rounded-xl shadow-sm border border-gray-100 p-8">

                <h1 class="text-lg font-bold text-gray-900 mb-6">재고 입고 처리</h1>

                <!-- 성공 후 리다이렉트되어 넘어온 플래시 메시지(성공 배너). 화면설계서 "공통 UI 규칙":
                     성공 메시지는 상단 배너로 표시. -->
                <div th:if="${message}" class="mb-4 rounded-md bg-green-100 text-green-800 px-4 py-2 text-sm" th:text="${message}"></div>

                <!--
                  th:object="${inboundRequestDto}" : 이 form 태그 안의 *{필드명} 표현이
                  전부 inboundRequestDto의 해당 필드를 가리키게 됨.
                  method="post" + th:action : POST /inventory/inbound 로 제출.
                -->
                <form th:action="@{/inventory/inbound}" th:object="${inboundRequestDto}" method="post" class="space-y-5">

                    <!-- 품목 선택 (필수) + 옆에 선택한 품목의 현재 재고 수량 안내
                         [피드백 반영] 출고 화면에만 있던 "현재 재고" 안내를 입고 화면에도 추가해달라는
                         요청에 맞춰, 출고 화면(outbound.html)의 마크업/스크립트를 그대로 가져다 씀. -->
                    <div>
                        <label class="block text-sm text-gray-600 mb-1" for="itemId">품목</label>
                        <div class="flex items-center gap-3">
                            <select id="itemId" th:field="*{itemId}"
                                    class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    onchange="updateCurrentStockHint()">
                                <option value="">선택하세요</option>
                                <!-- itemOptions: 삭제(비활성화)되지 않은 품목만 Controller에서 내려줌.
                                     th:attr로 각 option에 data-quantity(그 품목의 현재 재고 수량)를
                                     심어둠 -> 아래 자바스크립트가 읽어감(출고 화면과 동일한 방식) -->
                                <option th:each="item : ${itemOptions}"
                                        th:value="${item.id}"
                                        th:text="${item.name}"
                                        th:attr="data-quantity=${item.quantity}"></option>
                            </select>
                            <!-- 자바스크립트가 이 span의 글자만 바꿔치기함(현재 재고: N개) -->
                            <span id="currentStockHint" class="text-sm text-gray-500 whitespace-nowrap">현재 재고: -</span>
                        </div>
                        <!-- th:errors: itemId 필드에 바인딩/검증 오류가 있으면 그 메시지를 빨간 글씨로 표시.
                             화면설계서 공통 UI 규칙: "입력 필드 바로 아래 빨간 텍스트로 표시. alert() 사용 금지" -->
                        <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('itemId')}" th:errors="*{itemId}"></p>
                    </div>

                    <!-- 입고 수량 (필수, 1 이상 정수) -->
                    <div>
                        <label class="block text-sm text-gray-600 mb-1" for="quantity">입고 수량</label>
                        <input id="quantity" type="number" min="1" th:field="*{quantity}"
                               class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                               placeholder="0" />
                        <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
                    </div>

                    <button type="submit"
                            class="px-8 py-2.5 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700">
                        입고 등록
                    </button>
                </form>

                <!-- 최근 입고 이력 5건 (참고용 표시, 화면설계서 recentInbound) -->
                <div class="mt-10">
                    <h2 class="text-sm font-semibold text-gray-700 mb-3">최근 입고 이력</h2>

                    <!-- 빈 상태 처리: 화면설계서 공통 UI 규칙 "목록이 0건일 때 안내 문구 표시(빈 화면 금지)" -->
                    <p th:if="${#lists.isEmpty(recentInbound)}" class="text-gray-400 text-sm">최근 입고 이력이 없습니다.</p>

                    <ul th:unless="${#lists.isEmpty(recentInbound)}" class="text-sm">
                        <li th:each="h : ${recentInbound}"
                            class="grid gap-x-8 py-1 items-center" style="grid-template-columns: 1fr auto auto;">
                            <span class="text-gray-800" th:text="${h.itemName}"></span>
                            <span class="text-green-600 font-medium text-right" th:text="'+' + ${h.quantity}"></span>
                            <!-- 화면설계서 공통 UI 규칙: 날짜는 YYYY-MM-DD, 시각은 HH:mm:ss로 통일 -->
                            <span class="text-gray-400" th:text="${#temporals.format(h.processedAt, 'MM/dd HH:mm')}"></span>
                        </li>
                    </ul>
                </div>

            </div>
        </main>
    </div>
</div>

<!--
  품목 선택 드롭다운의 값이 바뀔 때마다, 그 옆의 "현재 재고: N개" 문구를 갱신하는 스크립트.
  서버에 다시 요청을 보내지 않고(=페이지를 새로고침하지 않고), 이미 화면에 내려받아 각
  <option>에 심어둔 data-quantity 값만 읽어서 화면 글자만 바꿔치기하는 아주 단순한 코드임
  (출고 화면 outbound.html의 동일 스크립트를 그대로 가져다 씀).
-->
<script>
    function updateCurrentStockHint() {
        var select = document.getElementById('itemId');
        var hint = document.getElementById('currentStockHint');
        var selectedOption = select.options[select.selectedIndex];
        var quantity = selectedOption.getAttribute('data-quantity');

        if (quantity === null) {
            // "선택하세요" 기본 옵션(값 없음)을 고른 경우
            hint.textContent = '현재 재고: -';
        } else {
            hint.textContent = '현재 재고: ' + quantity + '개';
        }
    }
</script>

<!-- [Tom Select 적용] "품목" select를 검색형 드롭다운으로 바꿈. 화면설계서엔 없는 UX 개선이라
     되돌릴 수 있게 해둠 - 되돌리려면 이 <script> 블록과 head의 Tom Select CSS/JS 두 줄만 지우면
     원래의 순수 <select>로 그대로 돌아감(다른 마크업은 전혀 안 건드림).
     onchange="updateCurrentStockHint()"는 <select> 태그에 그대로 남아있고, Tom Select는 선택이
     바뀔 때 원본 <select>에도 그대로 change 이벤트를 발생시켜주기 때문에 위 스크립트를 손댈
     필요가 전혀 없었음(data-quantity를 읽는 <option>들도 화면에서 안 보이게만 되고 그대로 남아있음). -->
<script>
    new TomSelect("#itemId", {
        placeholder: "선택하세요",
        create: false
    });
</script>

</body>
</html>
