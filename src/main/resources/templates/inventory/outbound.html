<!DOCTYPE html>
<!--
  IV-004 재고 출고 처리 화면

  - 담당자님이 보내주신 디자인 시안(IV-004_stock_outbound) 그대로 옮김: 상단 남색 헤더 +
    왼쪽 사이드바 + 오른쪽 흰색 카드. 레이아웃/색상 구성은 입고 화면(inbound.html)과 동일한
    틀을 그대로 재사용함.
  - 입고 화면 때와 마찬가지로, 카드(메인 영역) 너비를 w-full로 꽉 채워서 오른쪽에 빈 공간이
    남지 않도록 함.
  - [품목 관리(item/list.html) 추가 시 이 파일도 한 줄 수정함] 입고 화면과 동일한 이유로
    "품목 관리" 메뉴의 href="#"를 실제 주소 "/inventory"로 바꿈. 다른 부분은 전혀 건드리지 않음.
  - [재고 조회(inventory/list.html, IV-002) 추가 시 이 파일도 한 줄 수정함] 같은 이유로
    "재고 조회" 메뉴의 href="#"를 실제 주소 "/inventory/items"로 변경.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 출고 처리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- [Tom Select 적용] 품목 선택 <select>가 타이핑으로 검색되는 드롭다운이 되도록 붙임.
         품목이 많아지면 그냥 스크롤해서 찾아야 하던 문제를 해결하려고 추가함(요구사항 문서엔
         없는 UX 개선이라, 마음에 안 들면 언제든 이 링크/스크립트 세 줄만 지우면 원래대로 돌아감 -
         적용 전 원본은 tomselect_backup/outbound.html.before로 따로 백업해둠). -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex flex-col">

    <!-- 상단 헤더: 짙은 남색 바. 시스템 이름 + 현재 위치(품목관리)를 보여줌 -->
    <header class="bg-slate-900 text-white px-6 py-4 flex items-center shrink-0">
        <a class="font-bold tracking-wide" href="/">ERP SYSTEM</a>
        <span class="text-slate-400 ml-2">· 품목관리</span>
    </header>

    <div class="flex flex-1">

        <!-- 왼쪽 사이드바 메뉴: 재고 조회 / 입고 / 출고(현재 화면) / 품목 관리 -->
        <aside class="w-48 bg-white border-r border-gray-200 shrink-0 py-4 px-3">
            <nav class="space-y-1 text-sm">
                <a href="/inventory/items" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">재고 조회</a>
                <a href="/inventory/inbound" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">입고</a>
                <!-- 지금 만든 화면이라 파란색 배경으로 "현재 위치"를 표시 -->
                <a href="/inventory/outbound" class="block px-3 py-2 rounded-md bg-blue-600 text-white font-medium">출고</a>
                <a href="/inventory" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">품목 관리</a>
            </nav>
        </aside>

        <!-- 오른쪽 메인 영역: 실제 출고 처리 폼이 들어가는 흰색 카드.
             w-full로 메인 영역 너비에 꽉 차게 만들어서 오른쪽 빈 공간을 줄임(입고 화면과 동일). -->
        <main class="flex-1 p-8">
            <div class="w-full bg-white rounded-xl shadow-sm border border-gray-100 p-8">

                <h1 class="text-lg font-bold text-gray-900 mb-6">재고 출고 처리</h1>

                <!-- 성공 후 리다이렉트되어 넘어온 플래시 메시지(성공 배너) -->
                <div th:if="${message}" class="mb-4 rounded-md bg-red-100 text-red-800 px-4 py-2 text-sm" th:text="${message}"></div>

                <form th:action="@{/inventory/outbound}" th:object="${outboundRequestDto}" method="post" class="space-y-5">

                    <!-- 품목 선택 (필수) + 옆에 선택한 품목의 현재 재고 수량 안내 -->
                    <div>
                        <label class="block text-sm text-gray-600 mb-1" for="itemId">품목</label>
                        <div class="flex items-center gap-3">
                            <select id="itemId" th:field="*{itemId}"
                                    class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    onchange="updateCurrentStockHint()">
                                <option value="">선택하세요</option>
                                <!-- itemOptions: 삭제(비활성화)되지 않은 품목만 내려줌. th:attr로 각 option에
                                     data-quantity(그 품목의 현재 재고 수량)를 심어둠 -> 아래 자바스크립트가 읽어감 -->
                                <option th:each="item : ${itemOptions}"
                                        th:value="${item.id}"
                                        th:text="${item.name}"
                                        th:attr="data-quantity=${item.quantity}"></option>
                            </select>
                            <!-- 자바스크립트가 이 span의 글자만 바꿔치기함(현재 재고: N개) -->
                            <span id="currentStockHint" class="text-sm text-gray-500 whitespace-nowrap">현재 재고: -</span>
                        </div>
                        <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('itemId')}" th:errors="*{itemId}"></p>
                    </div>

                    <!-- 출고 수량 (필수, 1 이상 정수) -->
                    <div>
                        <label class="block text-sm text-gray-600 mb-1" for="quantity">출고 수량</label>
                        <input id="quantity" type="number" min="1" th:field="*{quantity}"
                               class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                               placeholder="0" />
                        <!-- 재고 부족 오류(InsufficientStockException)도 이 필드 오류로 표시됨(컨트롤러 참고) -->
                        <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
                    </div>

                    <!-- 버튼 + 안내 문구를 한 줄에 나란히 배치(디자인 시안과 동일) -->
                    <div class="flex items-center gap-3">
                        <button type="submit"
                                class="px-8 py-2.5 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700">
                            출고 처리
                        </button>
                        <span class="text-sm text-gray-500">재고가 부족하면 출고 처리되지 않습니다</span>
                    </div>
                </form>

                <!-- 최근 출고 이력 5건 -->
                <div class="mt-10">
                    <h2 class="text-sm font-semibold text-gray-700 mb-3">최근 출고 이력</h2>

                    <p th:if="${#lists.isEmpty(recentOutbound)}" class="text-gray-400 text-sm">최근 출고 이력이 없습니다.</p>

                    <ul th:unless="${#lists.isEmpty(recentOutbound)}" class="text-sm">
                        <li th:each="h : ${recentOutbound}"
                            class="grid gap-x-8 py-1 items-center" style="grid-template-columns: 1fr auto auto;">
                            <span class="text-gray-800" th:text="${h.itemName}"></span>
                            <!-- 입고 이력은 초록색 +N, 출고 이력은 빨간색 -N으로 구분(디자인 시안 색상 그대로) -->
                            <span class="text-red-600 font-medium text-right" th:text="'-' + ${h.quantity}"></span>
                            <span class="text-gray-400" th:text="${#temporals.format(h.processedAt, 'MM/dd HH:mm')}"></span>
                        </li>
                    </ul>
                </div>

            </div>
        </main>
    </div>
</div>

<!--
  품목 선택 드롭다운의 값이 바뀔 때마다, 그 옆의 "현재 재고: N개" 문구를 갱신하는 스크립트.
  서버에 다시 요청을 보내지 않고(=페이지를 새로고침하지 않고), 이미 화면에 내려받아 각
  <option>에 심어둔 data-quantity 값만 읽어서 화면 글자만 바꿔치기하는 아주 단순한 코드임.
-->
<script>
    function updateCurrentStockHint() {
        var select = document.getElementById('itemId');
        var hint = document.getElementById('currentStockHint');
        var selectedOption = select.options[select.selectedIndex];
        var quantity = selectedOption.getAttribute('data-quantity');

        if (quantity === null) {
            // "선택하세요" 기본 옵션(값 없음)을 고른 경우
            hint.textContent = '현재 재고: -';
        } else {
            hint.textContent = '현재 재고: ' + quantity + '개';
        }
    }
</script>

<!-- [Tom Select 적용] "품목" select를 검색형 드롭다운으로 바꿈. 화면설계서엔 없는 UX 개선이라
     되돌릴 수 있게 해둠 - 되돌리려면 이 <script> 블록과 head의 Tom Select CSS/JS 두 줄만 지우면
     원래의 순수 <select>로 그대로 돌아감(다른 마크업은 전혀 안 건드림).
     onchange="updateCurrentStockHint()"는 <select> 태그에 그대로 남아있고, Tom Select는 선택이
     바뀔 때 원본 <select>에도 그대로 change 이벤트를 발생시켜주기 때문에 위 스크립트를 손댈
     필요가 전혀 없었음(data-quantity를 읽는 <option>들도 화면에서 안 보이게만 되고 그대로 남아있음). -->
<script>
    new TomSelect("#itemId", {
        placeholder: "선택하세요",
        create: false
    });
</script>

</body>
</html>
