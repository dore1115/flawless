<!--
  templates/inventory/item/list.html
  화면 ID: IV-001 (품목 관리)
  대응 Controller: ItemController.list() [GET /inventory], ItemController.create() [POST /inventory],
                    ItemController.update() [POST /inventory/{id}], ItemController.delete() [POST /inventory/{id}/delete]
  관련 요구사항: REQ-F-S-009(품목 등록), REQ-F-S-010(품목 정보 수정), REQ-F-C-008(품목 삭제)
  ※ [피드백 반영] 비활성화(삭제)된 품목은 DB에는 그대로 남지만 이 목록에는 아예 나타나지 않게 함
    (ItemService.findAll()이 findAllByDeletedFalse(Pageable) 사용 - 요구사항 문서엔 없는 변경).
    그래서 이 화면에 보이는 품목은 전부 활성 상태라 "상태" 컬럼/"활성화" 버튼은 의미가 없어져 제거함.
    같은 이름으로 다시 등록하면(피드백) ItemService.create()가 삭제된 행을 내부적으로 재활성화함.

  Model 속성: items(Page<ItemRowDto>), itemCreateForm(ItemCreateForm), itemUpdateForm(ItemUpdateForm),
              message(String, flash), errorMessage(String, flash),
              openRegisterModal(Boolean, 등록 검증 실패 시 모달을 연 채로 재표시),
              openEditItemId(수정 검증 실패 시 해당 행의 모달을 연 채로 재표시할 대상 품목 id)
  ※ REQ-NF-G-003/REQ-NF-I-002로 로그인만 되어 있으면 누구나 접근/등록/수정/삭제 가능.
  ※ [재고 조회(inventory/list.html, IV-002) 추가 시 이 파일도 한 줄 수정함] 다른 화면들과 동일한
    이유로 "재고 조회" 메뉴의 href="#"를 실제 주소 "/inventory/items"로 변경.
-->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>품목 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex flex-col">

    <!-- 상단 헤더: 입고/출고 화면과 동일한 틀(짙은 남색 바) -->
    <header class="bg-slate-900 text-white px-6 py-4 flex items-center shrink-0">
        <a class="font-bold tracking-wide" href="/">ERP SYSTEM</a>
        <span class="text-slate-400 ml-2">· 품목관리</span>
    </header>

    <div class="flex flex-1">

        <!-- 왼쪽 사이드바 메뉴: 재고 조회 / 입고 / 출고 / 품목 관리(현재 화면) -->
        <aside class="w-48 bg-white border-r border-gray-200 shrink-0 py-4 px-3">
            <nav class="space-y-1 text-sm">
                <a href="/inventory/items" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">재고 조회</a>
                <a href="/inventory/inbound" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">입고</a>
                <a href="/inventory/outbound" class="block px-3 py-2 rounded-md text-gray-500 hover:bg-gray-50">출고</a>
                <!-- 지금 만든 화면이라 파란색 배경으로 "현재 위치"를 표시 -->
                <a href="/inventory" class="block px-3 py-2 rounded-md bg-blue-600 text-white font-medium">품목 관리</a>
            </nav>
        </aside>

        <!-- 오른쪽 메인 영역: 입고/출고 화면과 동일하게 w-full 카드로 빈 공간을 줄임 -->
        <main class="flex-1 p-8">
            <div class="w-full bg-white rounded-xl shadow-sm border border-gray-100 p-8">

                <!-- 성공 메시지: 화면설계서 공통 UI 규칙 - 상단 배너(플래시 메시지)로 표시 -->
                <div th:if="${message}" class="mb-4 rounded-md bg-green-100 text-green-800 px-4 py-2 text-sm" th:text="${message}"></div>
                <div th:if="${errorMessage}" class="mb-4 rounded-md bg-red-100 text-red-800 px-4 py-2 text-sm" th:text="${errorMessage}"></div>

                <div class="flex items-center justify-between mb-6">
                    <h1 class="text-lg font-bold text-gray-900">품목 관리</h1>
                    <button type="button" onclick="document.getElementById('registerModal').classList.remove('hidden')"
                            class="px-4 py-2 bg-blue-600 text-white text-sm rounded-md font-medium hover:bg-blue-700">
                        + 새 품목 등록
                    </button>
                </div>

                <table class="w-full text-sm">
                    <thead class="border-b border-gray-200">
                    <tr>
                        <th class="text-left font-semibold text-gray-500 py-2">품목명</th>
                        <th class="text-right font-semibold text-gray-500 py-2">액션</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 빈 상태: 화면설계서 공통 UI 규칙 - "등록된 데이터가 없습니다" 안내 (빈 화면 금지) -->
                    <tr th:if="${items.empty}">
                        <td colspan="2" class="py-6 text-center text-gray-400">등록된 데이터가 없습니다.</td>
                    </tr>
                    <!-- items에는 이미 비활성화(삭제)된 품목이 빠져 있어서(ItemService.findAll() 참고)
                         이 화면에 보이는 품목은 전부 활성 상태임 - "상태" 표시/"활성화" 버튼이 필요 없어짐. -->
                    <tr th:each="item : ${items.content}" class="border-b border-gray-100 last:border-0">
                        <td class="py-3 text-gray-900" th:text="${item.name}">장갑</td>
                        <td class="py-3 text-right space-x-3">
                            <button type="button"
                                    th:onclick="'document.getElementById(\'editModal-' + ${item.id} + '\').classList.remove(\'hidden\')'"
                                    class="text-blue-600 font-medium hover:underline">수정</button>
                            <form th:action="@{'/inventory/' + ${item.id} + '/delete'}" method="post" class="inline">
                                <button type="submit" class="text-red-600 font-medium hover:underline">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- 페이지네이션: 문서에 페이지당 건수/UI가 정해져 있지 않아, 화면 시안의 페이징 UI에
                     맞춰 Spring Data의 Page 정보를 그대로 이용해 만듦(ItemController.PAGE_SIZE 참고) -->
                <div class="flex items-center justify-center gap-1 mt-6 text-sm" th:if="${items.totalPages > 1}">
                    <a th:if="${items.hasPrevious()}" th:href="@{/inventory(page=${items.number - 1})}"
                       class="px-2 py-1 text-gray-500 hover:text-gray-800">&lt;</a>
                    <a th:each="p : ${#numbers.sequence(0, items.totalPages - 1)}"
                       th:href="@{/inventory(page=${p})}"
                       th:text="${p + 1}"
                       th:class="${p == items.number} ? 'px-3 py-1 rounded-md bg-blue-600 text-white font-medium' : 'px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100'">1</a>
                    <a th:if="${items.hasNext()}" th:href="@{/inventory(page=${items.number + 1})}"
                       class="px-2 py-1 text-gray-500 hover:text-gray-800">&gt;</a>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- ============================================================
     새 품목 등록 모달 (REQ-F-S-009)
     기본적으로 hidden 클래스로 숨겨두고, 버튼 클릭 시 자바스크립트로 hidden만 떼어내 보여줌
     (이 화면 전체에서 유일하게 서버 재요청 없이 화면을 바꾸는 부분이라, 출고 화면의 "현재 재고"
     안내와 같은 이유로 아주 짧은 자바스크립트를 예외적으로 사용함).
     ============================================================ -->
<div id="registerModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-gray-900">새 품목 등록</h2>
            <button type="button" onclick="document.getElementById('registerModal').classList.add('hidden')"
                    class="text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <form th:action="@{/inventory}" th:object="${itemCreateForm}" method="post">
            <label class="block text-sm text-gray-600 mb-1" for="itemCreateName">품목명 *</label>
            <input id="itemCreateName" type="text" th:field="*{name}" placeholder="예: 안전모"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <!-- th:errors: 공백(@NotBlank)/중복(DuplicateItemNameException) 오류가 여기에 함께 표시됨 -->
            <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            <p class="text-gray-400 text-xs mt-1">※ 현재 사용 중인 품목명은 사용할 수 없습니다(삭제된 품목명은 다시 등록할 수 있습니다).</p>

            <div class="flex justify-end gap-2 mt-6">
                <button type="button" onclick="document.getElementById('registerModal').classList.add('hidden')"
                        class="px-4 py-2 text-sm rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">취소</button>
                <button type="submit" class="px-4 py-2 text-sm rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700">등록</button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================
     품목 정보 수정 모달 (REQ-F-S-010) - 행마다 하나씩 미리 그려두고 hidden으로 숨겨둠.
     "수정" 버튼을 누르면 서버 재요청 없이 그 품목의 현재 재고 수량/등록일시/수정일시를
     모달에 바로 보여줄 수 있음(ItemRowDto 참고).
     ============================================================ -->
<div th:each="item : ${items.content}"
     th:id="'editModal-' + ${item.id}"
     class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-gray-900">품목 정보 수정</h2>
            <button type="button" th:onclick="'document.getElementById(\'editModal-' + ${item.id} + '\').classList.add(\'hidden\')'"
                    class="text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <form th:action="@{'/inventory/' + ${item.id}}" method="post">
            <!-- [버그 수정] 현재 보고 있던 페이지 번호를 같이 보내서, 수정 실패 시 ItemController.update()가
                 항상 0페이지로만 목록을 다시 그리는 바람에 2페이지 이상에 있는 품목을 수정하다 실패하면
                 이 모달 자체가 안 그려져 오류 메시지가 안 보이던 문제를 고침. -->
            <input type="hidden" name="page" th:value="${items.number}">
            <label class="block text-sm text-gray-600 mb-1" th:for="'editName-' + ${item.id}">품목명 *</label>
            <!-- 검증 실패로 이 화면에 다시 돌아온 경우(openEditItemId가 이 행의 id와 같을 때)에는
                 방금 입력했던 값을, 아니면 현재 품목명을 기본값으로 보여줌. 수정 폼은 행마다 새로
                 그려지는 구조라 th:object 대신 name 속성 + th:value로 직접 값을 채움. -->
            <input type="text" name="name" th:id="'editName-' + ${item.id}"
                   th:value="${openEditItemId != null and openEditItemId == item.id} ? ${itemUpdateForm.name} : ${item.name}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <!-- 공백/중복 오류 - 방금 이 행을 수정하려다 실패한 경우에만 표시 -->
            <p th:if="${openEditItemId != null and openEditItemId == item.id and #fields.hasErrors('itemUpdateForm.name')}"
               class="text-red-600 text-sm mt-1" th:text="${#fields.errors('itemUpdateForm.name')[0]}"></p>
            <p class="text-gray-400 text-xs mt-1">※ 중복된 품목명으로는 변경할 수 없습니다.</p>

            <div class="mt-4">
                <label class="block text-sm text-gray-600 mb-1">현재 재고 수량 (입고/출고에서만 수정 가능)</label>
                <div class="w-full border border-gray-200 bg-gray-50 rounded-md px-3 py-2 text-gray-500"
                     th:text="${item.currentStockQuantity} + ' 개'">0 개</div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4 text-sm">
                <div>
                    <span class="block text-gray-500">등록일시</span>
                    <span class="text-gray-700" th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</span>
                </div>
                <div>
                    <span class="block text-gray-500">수정일시</span>
                    <span class="text-gray-700"
                          th:text="${item.updatedAt != null} ? ${#temporals.format(item.updatedAt, 'yyyy-MM-dd HH:mm')} : '-'">-</span>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button type="button" th:onclick="'document.getElementById(\'editModal-' + ${item.id} + '\').classList.add(\'hidden\')'"
                        class="px-4 py-2 text-sm rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">취소</button>
                <button type="submit" class="px-4 py-2 text-sm rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700">저장</button>
            </div>
        </form>
    </div>
</div>

<!-- 검증 실패로 이 화면에 다시 돌아온 경우, 열려 있어야 했던 모달을 자동으로 다시 열어줌 -->
<script th:if="${openRegisterModal}">
    document.getElementById('registerModal').classList.remove('hidden');
</script>
<script th:if="${openEditItemId}" th:inline="javascript">
    var el = document.getElementById('editModal-' + /*[[${openEditItemId}]]*/ 0);
    if (el) {
        el.classList.remove('hidden');
    }
</script>

</body>
</html>
