<!--
  templates/auth/login.html
  화면 ID: AU-001 (로그인)
  대응 Controller: AuthController.loginForm() [GET /login], AuthController.login() [POST /login]
  관련 요구사항: REQ-F-M-003(로그인), REQ-F-C-005(비밀번호 재설정), REQ-F-W-004(최초 로그인 비밀번호 변경)
  Model 속성: loginForm(LoginForm), errorMessage(String)
-->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사원 로그인 | Enterprise Resource Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100 p-6">

<div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-[440px_1fr] bg-white shadow-xl overflow-hidden">

    <!-- 좌측: 브랜딩 영역 -->
    <div class="relative bg-blue-800 overflow-hidden flex flex-col justify-center p-12 md:p-14 min-h-[220px]">
        <div class="absolute w-72 h-72 rounded-full bg-blue-600/40 -top-6 -left-16"></div>
        <div class="absolute w-96 h-96 rounded-full bg-blue-700/30 -bottom-32 -right-20"></div>

        <div class="relative z-10">
            <h1 class="text-3xl font-extrabold text-white leading-snug">
                Enterprise<br>
                <span class="text-blue-200">Resource Planning</span>
            </h1>
            <p class="text-blue-100 text-sm mt-5">사내 통합 인증 시스템입니다. <br>등록된 사원만 이용할 수 있습니다.</p>
        </div>
    </div>

    <!-- 우측: 로그인 폼 영역 -->
    <div class="p-10 md:p-16 flex flex-col">
        <h2 class="text-2xl font-bold text-slate-900">사원 로그인</h2>
        <p class="text-sm text-slate-500 mt-2 mb-6">서비스 이용을 위해 인증 정보를 입력해 주세요.</p>

        <!-- 인증 실패 시에만 노출 (계정 존재 여부는 비노출: 아이디/비밀번호 오류 메시지를 분리하지 않음) -->
        <div th:if="${errorMessage}" class="flex items-center gap-3 bg-red-50 border border-red-100 rounded-md px-4 py-3 mb-6">
            <span class="flex-none w-4 h-4 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">!</span>
            <p class="text-sm font-medium text-red-600" th:text="${errorMessage}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        </div>
        <form th:action="@{/login}" method="post" class="space-y-5" th:object="${loginForm}" novalidate>

            <!-- 아이디: 4~30자 영문/숫자. 실패 시 아이디 값만 재표시, 비밀번호는 유지하지 않음 -->
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">아이디 </label>
                <input type="text" id="username" name="username" th:field="*{username}"
                       class="w-full h-11 px-4 border border-slate-300 rounded-md text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                       placeholder="4~30자 영문, 숫자" autocomplete="username">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-xs text-red-600 mt-1">아이디를 입력해 주세요.</p>
            </div>

            <!-- 비밀번호: 8자 이상 -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">비밀번호 </label>
                <input type="password" id="password" name="password" th:field="*{password}"
                       class="w-full h-11 px-4 border border-slate-300 rounded-md text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                       placeholder="8자 이상" autocomplete="current-password">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-red-600 mt-1">비밀번호를 입력해 주세요.</p>
            </div>

            <!-- REQ-F-C-005: 비밀번호 재설정 (계정 존재 여부 비노출 응답과 세트로 구현) -->
            <div class="flex justify-end">
                <a th:href="@{/password/reset}" class="text-sm font-medium text-blue-600 hover:underline">비밀번호를 잊으셨나요?</a>
            </div>

            <button type="submit" class="w-full h-12 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-md transition-colors">
                로그인
            </button>
        </form>

        <!-- REQ-F-S-004: 자율가입 없음. 계정은 관리자가 직접 발급 -->
        <div class="mt-10 pt-4 border-t border-slate-200 text-center">
            <p class="text-xs text-slate-400">계정 발급은 관리자(인사관리자)에게 문의해 주세요.</p>
        </div>
    </div>
</div>

</body>
</html>
