server:
  port: 8080
#  ssl:
#    enabled: true
#    key-store-type: PKCS12
#    key-store: file:./container/certs/keystore.p12
#    key-store-password: ${SSL_PASSWORD}
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    root: warn
    com.dsa.flawless: info
    org.springframework.web: warn
    org.hibernate.sql: warn