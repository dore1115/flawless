spring:
  application:
    name: flawless
  servlet:
    encoding:
      charset: UTF-8
      force: true
  messages:
    basename: messages, errors
    encoding: UTF-8

  profiles:
    active: local


server:
  tomcat:
    mbeanregistry:
      enabled: true
  servlet:
    session:
      tracking-modes: cookie
      # TODO(REQ-NF-L-003 세션 만료/동시 로그인 정책 미정): 세션 타임아웃 값이 없어서
      # 기본값(서버/컨테이너 설정에 의존)으로 동작 중. 정책 확정 후 timeout: 30m 같은 값 추가.
      # timeout: 30m
# TODO(REQ-NF-G-007 부하테스트/모니터링 표준 부재): actuator는 build.gradle에 있지만
# prometheus 레지스트리가 주석 처리돼 있고, 여기에도 management.endpoints 노출 설정이 없다.
# -> build.gradle의 micrometer-registry-prometheus 주석 해제 +
#    management:
#      endpoints:
#        web:
#          exposure:
#            include: health, prometheus
#    설정 추가 필요
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: erp-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  timezone: Asia/Seoul