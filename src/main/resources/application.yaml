spring:
  application:
    name: flawless
  servlet:
    encoding:
      charset: UTF-8
      force: true
  messages:
    basename: messages, errors
    encoding: UTF-8

  profiles:
    active: local


server:
  servlet:
    session:
      tracking-modes: cookie
      timeout: 30m
      # 사용자가 30분 동안 아무 활동도 안 하면 자동으로 로그아웃 (세션 만료)
# TODO(REQ-NF-G-007 부하테스트/모니터링 표준 부재): actuator는 build.gradle에 있지만
# prometheus 레지스트리가 주석 처리돼 있고, 여기에도 management.endpoints 노출 설정이 없다.
# -> build.gradle의 micrometer-registry-prometheus 주석 해제 +
#    management:
#      endpoints:
#        web:
#          exposure:
#            include: health, prometheus
#    설정 추가 필요
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: erp-backend
app:
  timezone: Asia/Seoul