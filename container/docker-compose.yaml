# TODO(REQ-NF-G-007 부하테스트/모니터링 표준 부재): 컨테이너 리소스 제한이 전혀 없어서
# 개발 환경 스펙에 따라 "서비스 불능 시작 지점"이 매번 달라진다.
# -> 각 서비스에 deploy.resources.limits (예: cpus: '1', memory: 1G) 추가하고,
#    Prometheus/Grafana 서비스도 이 compose 파일에 함께 추가해 지표 수집 표준화할 것.
services:
  app:
    build:
      context: ../
      dockerfile: container/Dockerfile
    container_name: erp-app
    ports:
      - "8080:8080"
    volumes:
      - ./certs/keystore.p12:/certs/keystore.p12:ro
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      # SSL을 위한 .p12파일 암호는 .env에 보관
      SSL_PASSWORD: ${SSL_PASSWORD}
      SSL_KEY_STORE_PATH: file:/certs/keystore.p12
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - erp-net
    mem_limit: 1g
    cpus: 1.0

  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: erp
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
      - erp-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: erp-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - erp-net

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      TZ: Asia/Seoul
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - erp-net
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - erp-net
networks:
  erp-net:
    driver: bridge

volumes:
  mysql-data:
  prometheus-data:
  grafana-data: