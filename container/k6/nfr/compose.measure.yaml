# ─────────────────────────────────────────────────────────────
# 측정 조건 고정용 오버라이드 (REQ-NF-G-007)
#
# seed/fix 브랜치마다 application*.yaml, prometheus.yml이 달라서 측정 조건이 흔들린다.
# 이 파일은 브랜치에 커밋하지 말고 그대로 두고, 어느 브랜치를 띄우든 같이 얹어서 실행한다.
#
#   docker compose -f container/docker-compose.yaml \
#                  -f container/k6/nfr/compose.measure.yaml up -d --build
#
# (경로는 레포 루트 기준. container/ 안에서 실행하면 -f docker-compose.yaml -f k6/nfr/compose.measure.yaml)
# ─────────────────────────────────────────────────────────────
services:
  app:
    environment:
      # 힙: 기본값(컨테이너 메모리의 25% ≈ 256MB) 대신 75%
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      # actuator를 별도 포트로 → 부하로 Tomcat이 포화돼도 지표 수집이 끊기지 않음
      # (ports:에 9091을 열지 않으므로 도커 네트워크 안에서만 접근 가능)
      MANAGEMENT_SERVER_PORT: "9091"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,metrics"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
      # tomcat_threads_* 지표
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
      # SQL 로그 끄기 (로깅 비용이 측정에 섞이지 않게)
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: "warn"
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: "warn"
      # G-005/G-006 감사 로그는 남겨야 증거 캡처가 됨 (root가 warn이어도 AUDIT만 info)
      LOGGING_LEVEL_AUDIT: "info"

  prometheus:
    volumes:
      - ./k6/nfr/prometheus.measure.yml:/etc/prometheus/prometheus.yml:ro
