# TODO(REQ-NF-G-007 부하테스트/모니터링 표준 부재): 컨테이너 리소스 제한이 전혀 없어서
# 개발 환경 스펙에 따라 "서비스 불능 시작 지점"이 매번 달라진다.
# -> 각 서비스에 deploy.resources.limits (예: cpus: '1', memory: 1G) 추가하고,
#    Prometheus/Grafana 서비스도 이 compose 파일에 함께 추가해 지표 수집 표준화할 것.
services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306'
      # deploy:
      #   resources:
      #     limits:
      #       cpus: '1'
      #       memory: 1G
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
      # deploy:
      #   resources:
      #     limits:
      #       cpus: '1'
      #       memory: 1G
